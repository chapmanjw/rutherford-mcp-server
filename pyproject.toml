[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rutherford-mcp-server"
version = "3.2.0"
description = "An MCP server that orchestrates a crew of agentic coding agents over the Agent Client Protocol (ACP)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Chapman" }]
requires-python = ">=3.11"
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "cli",
    "orchestration",
    "consensus",
    "claude-code",
    "codex",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    # Bounded at the MAJOR, and the bound is the whole point. CI installs with `uv sync --locked`, but the
    # lock is not shipped (see the sdist include list below) and the published install instructions invoke
    # this package with no constraint of their own -- so what CI proves and what a user resolves are two
    # different dependency sets, and only this string constrains the second one.
    #
    # Measured 2026-09-05: an unbounded `>=3.3` resolved a fresh install to fastmcp 4.0.3 / mcp 2.1.1 while
    # the lock held 3.3.1 / 1.28.1. Every published release so far has therefore run on a dependency MAJOR
    # its own CI never executed. It happens to work, with one observed regression: under 4.0.3 a tool error
    # writes a rich-formatted, non-JSON line to stderr, which breaks the one-JSON-object-per-line contract
    # `runtime/logging.py` maintains deliberately and that `_report_drops` goes out of its way to preserve.
    #
    # The forward risk is worse than that. `server.py` calls `mcp.run(transport=..., show_banner=...)` with
    # keywords a major release is free to rename or drop; that failure lands at BOOT, on every `uvx` install,
    # with a fully green build. The same reasoning already written below for the ACP SDK applies here without
    # modification -- a framework can retire behaviour this server leans on without touching a signature --
    # and this dependency had been the one left open.
    #
    # `<4` claims only the major that has actually been run. Raising it means running the release-resolve
    # check (`scripts/check_server_boot.py --wheel`) against the new major, not editing this line.
    "fastmcp>=3.3,<4",
    "pydantic>=2.13",
    "psutil>=7",
    "python-toon>=0.1.3",
    # Pinned to one exact release, and that is LOAD-BEARING; keep it in lockstep with session.py's handling of
    # every agent-controlled response field. The lock file is not shipped (see the sdist include list below)
    # and the published install instructions invoke this package with no constraint of their own, so this
    # string is the only thing standing between a user and whatever the index resolves to.
    #
    # 0.11.0 removed ACP model channel 1 outright (NewSessionResponse.models / LoadSessionResponse.models,
    # SessionModelState, ModelInfo, session/set_model). Model selection now runs through channel 2 (the
    # configOptions "model" select) and the Cursor launch --model flag, with every legacy-channel read behind
    # a defensive getattr and an unconfirmable selection raised as MODEL_UNAVAILABLE -- never a silent no-op on
    # the agent's default.
    #
    # 0.12.0 is validated and the hazard it actually shipped is NOT another channel removal -- channel 2 is
    # intact, the protocol version is unchanged, and exactly one unused public name went away. What changed is
    # DESERIALIZATION, which is worse for being invisible: the SDK now salvages a field it cannot parse instead
    # of rejecting the payload, and skips a list item it cannot parse instead of failing the list. So an
    # agentCapabilities blob that 0.11 refused outright now arrives as a raw dict through a field still
    # annotated as a model -- a type a checker cannot catch and a well-behaved fake agent cannot produce -- and
    # a malformed configOptions entry is silently dropped where it used to be a loud handshake failure. Both
    # are guarded here now: capabilities are read through a defensive helper rather than off the attribute, an
    # unreadable category narrows to untagged instead of comparing unequal, and every post-spawn step in
    # ACPSession.open runs inside one teardown guard so a read that raises cannot orphan the agent process.
    #
    # 0.12.1 is validated and is a far larger release than its patch number suggests. It DELETED the pluggable
    # dispatcher / queue / state-store layer outright (acp/task/dispatcher.py, queue.py and state.py are gone)
    # and dropped four keyword arguments from Connection.__init__ along with them. None of that reaches here:
    # nothing in this package names a removed symbol or passes a removed argument, because the SDK is driven
    # through spawn_agent_process rather than assembled by hand.
    #
    # What was checked, and why each mattered:
    #   * _deserialize.py is BYTE-IDENTICAL to 0.12.0, so the salvage-instead-of-reject behaviour described
    #     above -- the actual hazard of this dependency -- is unchanged and the guards written for it still
    #     apply. That single fact is most of the confidence here.
    #   * Connection.close now rejects pending outgoing requests FIRST and moves the task shutdown into a
    #     `finally`, which is strictly safer, and both it and MessageSender.close still latch on an
    #     already-closed flag -- the property session.py's non-cancellable teardown stage depends on.
    #   * schema.py is regenerated, not merely restyled: four response/error `id` fields became REQUIRED, the
    #     content-block and configOption unions gained `type` / `kind` discriminators, and several open `str`
    #     fields narrowed to Literal unions -- including SessionConfigOptionSelect.category, which the model
    #     and effort channels read. The full suite and mypy strict both pass against it, so no narrowing bites
    #     a path this client takes, but that is the surface to re-check next time.
    #
    # Hence an exact pin rather than a range or a minor wildcard. Note which distinction is NOT doing the
    # work here: `<0.13` and `==0.12.*` both admit 0.12.z releases that do not exist yet, so neither one
    # protects against an unreleased patch -- `==0.12.*` merely also excludes falling back to 0.11. What
    # rules out both is the 0.11 -> 0.12 lesson itself. A compatible-looking bump can retire validation this
    # client was relying on without touching a signature, and nothing about a patch number exempts it from
    # that; the guards below were written against behaviour, not against a version range. So the only
    # release claimed here is the one actually put through the malformed-payload suite. Raise it
    # deliberately: re-read the deserialization behaviour, run tests/test_acp_wire.py against the new
    # release, then move the pin.
    "agent-client-protocol==0.12.1",
]

[project.urls]
Homepage = "https://github.com/chapmanjw/rutherford-mcp-server#readme"
Repository = "https://github.com/chapmanjw/rutherford-mcp-server.git"
Issues = "https://github.com/chapmanjw/rutherford-mcp-server/issues"
Changelog = "https://github.com/chapmanjw/rutherford-mcp-server/blob/main/CHANGELOG.md"

[project.scripts]
# NOTE: deliberately no bare `rutherford` alias. The sibling product rutherford-cli builds its binary from
# cmd/rutherford, so it installs an executable named exactly `rutherford`; shipping one here too would make
# the two race on PATH for anyone with both. Terminal subcommands run as `python -m rutherford <cmd>`.
rutherford-mcp-server = "rutherford.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.4",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-psutil>=7",
    # Only the integration suite can hang: it drives real agents over stdio, which is where the
    # stdin-inheritance deadlock lived. The unit suite is hermetic by design and needs nothing.
    "pytest-timeout>=2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rutherford"]
# Ship the built-in role personas (package data) alongside the .py modules so importlib.resources
# resolves them from an installed wheel, not just a source checkout.
artifacts = ["src/rutherford/roles/*.md"]

[tool.hatch.build.targets.sdist]
include = ["src/rutherford", "README.md", "CHANGELOG.md", "LICENSE"]
artifacts = ["src/rutherford/roles/*.md"]

# --- Lint and format (ruff is the single Python equivalent of the siblings'
# ESLint/Prettier and Spotless/Checkstyle; 120-char lines match the Java
# Checkstyle setting). ----------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "ASYNC",# flake8-async
    # flake8-bandit. This package spawns other programs, resolves executables from PATH, and fetches URLs
    # named in config -- the exact surface these rules watch, and a surface most libraries never have. It
    # currently reports nothing that is a defect, which is the point: the value is that the NEXT subprocess
    # call or URL sink cannot be added silently. Each one has to carry a `noqa` with a reason, and that
    # annotation is a beacon a reviewer sees. Tests are held to the same standard, because `just check` runs
    # them on a contributor's machine -- a hostile test in a pull request attacks whoever reviews it.
    # Ruff implements 73 of bandit's rules and runs in the lint pass already here. Standalone bandit adds
    # dataflow-sensitive analysis on top; that gap is a DELIBERATE deferral, not an oversight. Revisit it
    # only if something is found that this misses, never speculatively -- a second tool is a second
    # dependency, config, gate stage and triage stream.
    "S",
    # Complexity, judged per FUNCTION rather than per file. A file-length cap was considered and rejected:
    # it fires on six cohesive core modules the day it lands, and length is a poor proxy anyway -- a long
    # run of related model definitions reads better than a short function with deep nesting. These target
    # the thing that actually costs a reader. The functions above the bar today are annotated individually,
    # so each exception is visible and a NEW one has to be argued for rather than absorbed.
    "C901",     # mccabe cyclomatic complexity
    "PLR0915",  # too many statements
]
ignore = [
    "N818", # exception names need not end in "Error" (RutherfordError already does)
]

[tool.ruff.lint.per-file-ignores]
# S101 (`assert`) only. A pytest suite IS assertions -- 2,111 of them here -- and `assert` is not an attack
# vector, so the rule is pure noise in tests. Every other security rule stays live in tests deliberately.
"tests/**/*.py" = ["B011", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["rutherford"]

[tool.ruff.format]
docstring-code-format = true

# --- Type checking (mypy strict; matches the siblings' strict tsc). ------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]
# scripts/ holds the gate runner, which tests/test_gate.py imports to compare its stage list against
# the CI workflow. Type-checking it too means that comparison cannot rot behind a bad import.
mypy_path = "scripts"

[[tool.mypy.overrides]]
module = ["toon", "toon.*"]
ignore_missing_imports = true

# Tests are type-checked, but do not require full annotations on every test function.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- Tests (pytest with the integration marker deselected by default;
# pytest-cov enforces a coverage floor that fails the build). -------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not integration' --cov=rutherford --cov-report=term-missing --cov-fail-under=90"
markers = [
    "integration: real-CLI tests, local only, skipped by default (run with -m integration)",
]

[tool.coverage.run]
source = ["rutherford"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]
