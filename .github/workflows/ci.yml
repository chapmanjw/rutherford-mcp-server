name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pin the GITHUB_TOKEN ceiling in-repo. The repository default is already read-only, so this
# changes nothing today; it keeps a future settings flip, or a job added to this file later,
# from silently gaining write. Every job here only reads the checkout and runs the local gate.
permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # A bound on a HUNG job, not a performance target. The default is six hours, so one wedged run burns
    # that on every matrix cell before GitHub reclaims it -- and shows a spinner the whole time, which reads
    # as "still working" rather than "already dead". This project has form here: tests/conftest.py documents
    # a Windows ProactorEventLoop teardown that hangs forever on 3.11/3.12, and the subprocess deadlock in
    # the stdin-inheritance fix was the same shape. The slowest cell is around five minutes, so this is
    # roughly five times headroom: late enough never to fire on a slow runner, early enough that a hang
    # costs minutes.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.13 is in the matrix because the package classifiers advertise it -- a claimed-supported
        # runtime must be gated, not assumed.
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      # --locked fails on a stale lockfile instead of silently re-resolving. Several pinned versions sit
      # exactly on their first patched release with no headroom, so a downward resolve would reopen a
      # closed advisory while the build stayed green.
      - name: Install dependencies
        run: uv sync --locked

      # The unit test step (with the coverage floor in pyproject addopts) is a required
      # gate: a failing test or coverage below the floor fails the build, with no override.
      # Live-CLI integration tests stay deselected here (no auth available in CI).
      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: License header check
        run: uv run python scripts/check_license_headers.py

      - name: Type check (mypy, strict)
        run: uv run mypy

      - name: Unit tests (with coverage floor)
        run: uv run pytest

      # The aggregate floor can hide a near-zero module behind a well-covered core; this one
      # catches a new dead zone anywhere under src/rutherford (every source file is checked per-file).
      - name: Per-file coverage floor
        run: uv run python scripts/check_per_file_coverage.py

      # The stdio entrypoint is the product's front door; nothing else in the gate executes
      # `python -m rutherford`, so __main__/main wiring could break with a green build.
      - name: Entrypoint smoke check
        run: uv run python -m rutherford --smoke

      - name: Build sdist and wheel
        run: uv build
